name: Workflow integrity

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-integrity:
    name: workflow-integrity
    runs-on: ubuntu-latest
    steps:
      - name: Reject workflow and local action changes
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          changed_files="$(gh api --paginate \
            "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[].filename')"
          if printf '%s\n' "${changed_files}" | grep -Eq '(^|/)\.github/(workflows|actions)/'; then
            echo 'workflow-integrity: workflow or local action files changed; explicit qualification required.' >&2
            exit 1
          fi
          echo 'workflow-integrity: PASS'
