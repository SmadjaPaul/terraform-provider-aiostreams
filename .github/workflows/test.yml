name: Go tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    if: false
    # Stable check name for branch protection; validate both normal PRs and pushes.
    name: provider-go-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test -race ./...
      - run: go vet ./...
